[package]
name = "bloom"
version = "3.10.0"
description = ""
authors = ["sehaz"]
edition = "2021"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.61"
windows-collections = "0.2"
windows = { version = "0.61", features = [
	"Win32_UI_Input",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_TextServices",
	"Win32_Globalization",
	"Win32_Devices_HumanInterfaceDevice",
	"Win32_UI_Shell",
	"Win32_UI_Shell_PropertiesSystem",
	"Win32_UI_Shell_Common",
	"Win32_System_Search",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_Environment",
	"Win32_System_DataExchange",
	"Win32_System_Shutdown",
	"Win32_System_Power",
	"Win32_Networking_WinHttp",
	"Win32_UI_WindowsAndMessaging",
	"Win32_UI_HiDpi",
	"Win32_Foundation",
	"Win32_System_Com",
	"Win32_UI_Accessibility",
	"Win32_System_Variant",
	"Media_Control",
	"Win32_Media_Audio",
	"Win32_Media_Audio_Endpoints",
	"Win32_System_Threading",
	"Win32_System_Memory",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_SystemInformation",
	"Win32_System_ProcessStatus",
	"Win32_System_Wmi",
	"Win32_Storage_FileSystem",
	"Win32_System_Ole",
	"Data_Pdf",
	"Storage",
	"Storage_Streams",
	"Win32_System_Console",
	"Graphics_Imaging",
	"Win32_Graphics_Imaging",
	"Win32_Graphics_Dwm",
	"Graphics_Capture",
	"Graphics_DirectX",
	"Graphics_DirectX_Direct3D11",
	"Win32_Graphics_Direct3D",
	"Win32_Graphics_Direct3D11",
	"Win32_Graphics_Dxgi",
	"Win32_Graphics_Dxgi_Common",
	"Win32_System_WinRT",
	"Win32_System_WinRT_Direct3D11",
	"Win32_System_WinRT_Graphics_Capture",
	"Security_Authorization_AppCapabilityAccess",
	"Win32_Graphics_Gdi",
	"Win32_System_LibraryLoader",
	"Win32_System_IO",
	"Win32_Security",
	"Win32_Security_Authorization",
	"Win32_Security_Cryptography",
	"Win32_System_Registry",
	"Win32_Devices_FunctionDiscovery",
	"Win32_Devices_Display",
	"Win32_Devices_DeviceAndDriverInstallation",
	"Win32_System_TaskScheduler",
	"Win32_Graphics_GdiPlus",
	"Devices_Radios",
	"Devices_Bluetooth",
	"Devices_Bluetooth_GenericAttributeProfile",
	"Devices_Power",
	"Gaming_Input",
	"Devices_Enumeration",
	"Foundation_Collections",
	"Win32_Media_KernelStreaming",
	"System_Power",
	"Win32_NetworkManagement_IpHelper",
	"Win32_NetworkManagement_Ndis",
	"Win32_NetworkManagement_WiFi",
	"Win32_NetworkManagement_WNet",
	"Networking_Connectivity",
	"Networking_NetworkOperators",
	"UI_Notifications",
	"UI_Notifications_Management",
	"Data_Xml_Dom",
	"Win32_UI_Notifications",
	"ApplicationModel"
] }
base64 = "0.22"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2"
window-vibrancy = "0.7.1"
wmi = "0.14"
tokio = { version = "1", features = ["time", "sync"] }
webview2-com = "0.38"
image = "0.25"
# Reads the thumbnail or text inside Office files for shelf previews.
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
tauri-plugin-drag = "2.1.1"
# LocalSend receiving into the shelf: its HTTPS (TLS with a certificate of
# Bloom's own), only while receiving is turned on.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
tauri-plugin-dialog = "2"
rustfft = "6"

